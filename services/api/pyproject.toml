[project]
name = "cyberai-api"
version = "0.1.0"
description = "CYBER AI - Cybersecurity AI platform API (modular monolith)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "pyjwt>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberai"]

# =============================================================================
# Ruff - formatting + linting
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime
    "T20",       # print statements
    "SIM",       # simplify
    "TID",       # tidy imports
    "RUF",       # ruff specific
    "ASYNC",     # async correctness
    "S",         # bandit security rules
]
ignore = [
    "A005",   # module shadows a stdlib module (cyberai.platform is intentional)
    "S101",   # assert is fine in tests (narrowed below anyway)
    "B008",   # FastAPI Depends() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["cyberai"]

# =============================================================================
# mypy - strict typing
# =============================================================================
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*", "jwt.*"]
ignore_missing_imports = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: requires PostgreSQL and Redis to be reachable",
]

[tool.coverage.run]
source = ["src/cyberai"]
branch = true
