services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cyberai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberai_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cyberai}
    volumes:
      - cyberai-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberai} -d ${POSTGRES_DB:-cyberai}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cyberai

  redis:
    image: redis:7-alpine
    container_name: cyberai-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cyberai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cyberai

  api:
    build:
      context: ../../services/api
      dockerfile: ../../infra/docker/Dockerfile.api
    container_name: cyberai-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NOMERCY_ENVIRONMENT: local
      NOMERCY_DEBUG: "true"
      NOMERCY_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-cyberai}:${POSTGRES_PASSWORD:-cyberai_dev_password}@postgres:5432/${POSTGRES_DB:-cyberai}
      NOMERCY_REDIS__URL: redis://redis:6379/0
      NOMERCY_LOGGING__FORMAT: console
      NOMERCY_LOGGING__LEVEL: DEBUG
      NOMERCY_APP__TRUSTED_HOSTS: '["localhost","127.0.0.1","cyberai-api"]'
      NOMERCY_APP__EXPOSE_DOCS: "true"
      NOMERCY_INFERENCE__REQUEST_TIMEOUT_SECONDS: "300"
      NOMERCY_INFERENCE__FIRST_TOKEN_TIMEOUT_SECONDS: "120"
      NOMERCY_OPENAI_COMPATIBLE__ENABLED: "true"
      NOMERCY_OPENAI_COMPATIBLE__API_KEY: ollama
      NOMERCY_OPENAI_COMPATIBLE__BASE_URL: http://host.docker.internal:11434/v1
      NOMERCY_OPENAI_COMPATIBLE__MODEL: dolphin3:8b
      NOMERCY_OPENAI_COMPATIBLE__MODEL_KEY: openai-compatible-chat
      NOMERCY_OPENAI_COMPATIBLE__DISPLAY_NAME: Dolphin 3 8B
      NOMERCY_OPENAI_COMPATIBLE__REQUEST_TIMEOUT_SECONDS: "300"
      NOMERCY_MODELS__DEFAULT_MODEL: openai-compatible-chat
      NOMERCY_MODELS__FALLBACK_MODELS: "[]"
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    networks:
      - cyberai
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ../../services/api
      dockerfile: ../../infra/docker/Dockerfile.api
    container_name: cyberai-migrate
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOMERCY_ENVIRONMENT: local
      NOMERCY_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-cyberai}:${POSTGRES_PASSWORD:-cyberai_dev_password}@postgres:5432/${POSTGRES_DB:-cyberai}
      NOMERCY_REDIS__URL: redis://redis:6379/0
      NOMERCY_LOGGING__FORMAT: console
    networks:
      - cyberai
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: cyberai-web
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ""
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - cyberai
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  cyberai-postgres-data:
  cyberai-redis-data:

networks:
  cyberai:
    driver: bridge
